name: Django Tests & Quality Checks

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Ejecutar diariamente a las 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  tests:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install coverage pytest pytest-django pytest-cov
    
    - name: Run Django system check
      run: |
        python manage.py check --deploy
    
    - name: Run migrations
      run: |
        python manage.py migrate --no-input
    
    - name: Run unit tests with pytest
      run: |
        pytest mi_app/tests/test_unit_models.py -v --cov=mi_app --cov-report=term-missing
    
    - name: Run integration tests
      run: |
        pytest mi_app/tests/test_integration_workflows.py -v --tb=short
    
    - name: Run E2E tests
      run: |
        pytest mi_app/tests/test_e2e_workflows.py -v --tb=short -m e2e || true
    
    - name: Run all tests with coverage
      run: |
        pytest mi_app/tests/ -v --cov=mi_app --cov-report=xml --cov-report=term-missing
    
    - name: Run legacy Django tests (compatibility)
      run: |
        coverage run --source='.' manage.py test mi_app --no-input || true
        coverage xml || true
        coverage report || true

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false
    
    - name: Generate test report
      if: always()
      run: |
        echo "=== PYTEST Results ===" > test_report.txt
        pytest mi_app/tests/ -v --tb=short >> test_report.txt 2>&1 || true
        echo "" >> test_report.txt
        echo "=== Django Test Results ===" >> test_report.txt
        python manage.py test mi_app --no-input -v 2 >> test_report.txt || true
        cat test_report.txt
    
    - name: Upload test report
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-report-py${{ matrix.python-version }}
        path: test_report.txt

  linting:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort

    - name: Lint with flake8 (warnings only)
      run: |
        # Stop on E999, F821, F822, F823 but warn on others
        flake8 mi_app --count --select=E9,F63,F7,F82 --show-source --statistics || true
        flake8 mi_app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    
    - name: Check code formatting with black
      run: black --check mi_app || true
    
    - name: Check import sorting with isort
      run: isort --check-only mi_app || true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install bandit safety

    - name: Run Bandit security check
      run: |
        bandit -r mi_app --format json -o bandit-report.json || true
        bandit -r mi_app || true

    - name: Check dependencies for vulnerabilities
      run: |
        safety check --json || true

  performance:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run migrations
      run: |
        python manage.py migrate --no-input

    - name: Check for N+1 queries (sample test)
      run: |
        python manage.py test mi_app.tests.test_unitarios_extendidos.EstadisticasViewTests.test_estadisticas_eficiencia -v 2 || true

    - name: Verify database indexes
      run: |
        python manage.py test mi_app.tests.test_unitarios_extendidos.IndicesBD -v 2 || true

  quality-gate:
    runs-on: ubuntu-latest
    needs: [tests, linting, security]
    
    if: always()
    
    steps:
    - name: Check quality gates
      run: |
        echo "✅ Tests Status: ${{ needs.tests.result }}"
        echo "✅ Linting Status: ${{ needs.linting.result }}"
        echo "✅ Security Status: ${{ needs.security.result }}"
        
        if [ "${{ needs.tests.result }}" = "failure" ]; then
          echo "❌ Tests failed"
          exit 1
        fi
        
        echo "✅ All quality gates passed!"

  notify-slack:
    runs-on: ubuntu-latest
    needs: quality-gate
    
    if: always()
    
    steps:
    - name: Notify Slack (Optional)
      if: env.SLACK_WEBHOOK_URL
      run: |
        STATUS="${{ needs.quality-gate.result }}"
        if [ "$STATUS" = "success" ]; then
          MESSAGE="✅ CI/CD Pipeline passed all checks"
        else
          MESSAGE="❌ CI/CD Pipeline failed - check logs"
        fi
        # Descomentar si tienes webhook de Slack
        # curl -X POST ${{ secrets.SLACK_WEBHOOK_URL }} -d "{\"text\":\"$MESSAGE\"}"
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
