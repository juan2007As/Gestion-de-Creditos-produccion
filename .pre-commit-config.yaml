repos:
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        name: Escaneo de secretos (config-rules §2)
        args: ['--baseline', '.secrets.baseline']
        exclude: >
          (?x)^(
            .*\.secrets\.baseline|
            Reglas de desarrollo.*
          )$
